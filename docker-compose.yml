# Container entry points; nothing but Docker is required on the host.
#
#   docker compose up gui                 # GUI -> http://localhost:8765
#   docker compose run --rm demo          # offline demo -> ./out/demo_report.html
#   docker compose run --rm start         # interactive guided run
#   docker compose run --rm triage run /work/sbom.json -o /out/report.json --html /out/report.html
#
# Files under this directory appear at /work; reports written to /out land in
# ./out. AI settings, the NVD key and the GitHub token are read from your shell
# environment (all optional).

x-credentials: &credentials
  PATCHTRIAGE_AI_PROVIDER:
  PATCHTRIAGE_AI_API_KEY:
  PATCHTRIAGE_AI_BASE_URL:
  PATCHTRIAGE_AI_MODEL:
  PATCHTRIAGE_AI_SCREEN_MODEL:
  PATCHTRIAGE_AI_DEEP_MODEL:
  ANTHROPIC_API_KEY:
  OPENAI_API_KEY:
  NVD_API_KEY:
  GITHUB_TOKEN:
  GH_TOKEN:

services:
  # Each browser gets an isolated anonymous workspace; targets, evidence and
  # reports live in the named 'config' volume for six hours.
  gui:
    build: .
    ports:
      - "${PATCHTRIAGE_BIND:-127.0.0.1}:${PATCHTRIAGE_PORT:-8765}:8765"
    environment:
      <<: *credentials
      PATCHTRIAGE_DEPLOYMENT_MODE: ${PATCHTRIAGE_DEPLOYMENT_MODE:-local}
      PATCHTRIAGE_ALLOW_GENERIC_REPOSITORIES: ${PATCHTRIAGE_ALLOW_GENERIC_REPOSITORIES:-true}
      PATCHTRIAGE_COOKIE_SECURE: ${PATCHTRIAGE_COOKIE_SECURE:-auto}
      PATCHTRIAGE_BUILD_SHA: ${PATCHTRIAGE_BUILD_SHA:-development}
    volumes:
      - cache:/home/patchtriage/.cache
      - config:/home/patchtriage/.config
    command: ["serve", "--host", "0.0.0.0", "--no-browser"]
    restart: unless-stopped
    healthcheck:
      # The runtime image has no curl; bash's /dev/tcp checks /api/config.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8765 && printf 'GET /api/config HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 3s

  # Offline demo: no network, no keys.
  demo:
    build: .
    volumes:
      - ./out:/out

  # `run` keeps stdin/tty attached so the wizard can ask its questions; the
  # browser step is skipped in the container and the ./out path is printed.
  start:
    build: .
    stdin_open: true
    tty: true
    environment:
      <<: *credentials
      PATCHTRIAGE_IN_CONTAINER: "1"
      PATCHTRIAGE_ALLOW_GENERIC_REPOSITORIES: ${PATCHTRIAGE_ALLOW_GENERIC_REPOSITORIES:-true}
    volumes:
      - ./:/work
      - ./out:/out
      - cache:/home/patchtriage/.cache
    command: ["start"]

  # Scriptable: pass any command after the service name.
  triage:
    build: .
    environment:
      <<: *credentials
      PATCHTRIAGE_IN_CONTAINER: "1"
    volumes:
      - ./:/work
      - ./out:/out
      - cache:/home/patchtriage/.cache
    command: ["--help"]

volumes:
  cache:
  config:
