<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PatchTriage theme mockup (B: blue to cyan)</title>
<!-- Reference only. Approved direction "B" for docs/superpowers/specs/2026-10-17-intel-theme-design.md.
     Google Fonts is used here for convenience; the product must embed IBM Plex (see the plan, Task 1). -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.ws{--bg:#060a13;--s1:#0b1222;--s2:#101a2f;--line:#1b2740;--line2:#26344f;--ink:#e4eaf6;--mut:#8391ab;--dim:#56637c;
  --im:#ff5a5f;--oc:#ffb340;--sc:#5b8cff;--de:#64748b;
  font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);border-radius:10px;overflow:hidden;border:1px solid #1b2740;font-size:13px}
.ws.a{--acc:#8b7dff;--acc2:#b4a9ff;--glow:0 0 0 1px #8b7dff55,0 0 18px #8b7dff33}
.ws.b{--acc:#22d3ee;--acc2:#3b82f6;--glow:0 0 0 1px #22d3ee66,0 0 20px #22d3ee33}
.ws *{box-sizing:border-box}
.top{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0a1120,#060a13)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.02em}
.mark{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--acc);box-shadow:var(--glow);position:relative}
.mark:after{content:"";position:absolute;inset:5px;border-radius:2px;background:var(--acc)}
.b .mark{border-image:linear-gradient(135deg,var(--acc2),var(--acc)) 1;border-radius:0}
.crumb{color:var(--mut);font-weight:400;margin-left:14px}.crumb b{color:var(--ink);font-weight:500}
.tbtn{border:1px solid var(--line2);background:transparent;color:var(--ink);border-radius:6px;padding:6px 12px;font:inherit}
.tbtn.p{border-color:transparent;background:var(--acc);color:#061018;font-weight:600}
.b .tbtn.p{background:linear-gradient(90deg,var(--acc2),var(--acc));color:#fff}
.body{display:grid;grid-template-columns:230px 1fr;min-height:620px}
.side{border-right:1px solid var(--line);padding:14px;background:var(--s1);display:flex;flex-direction:column;gap:10px}
.side h4{margin:0;font-size:12px;color:var(--mut);font-weight:500}
.tgt{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--bg)}
.tgt.on{border-color:var(--acc);box-shadow:var(--glow)}
.tgt b{display:block;font-weight:600}.tgt small{color:var(--mut)}
.tgt .st{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.stats{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stats div{background:var(--s1);padding:8px}.stats b{display:block;font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}.stats span{color:var(--mut);font-size:11px}
.main{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:8px}
.head{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:14px 16px;border-top:2px solid var(--im);border-radius:8px 8px 0 0}
.badge{border:1px solid var(--im);color:var(--im);background:#ff5a5f14;border-radius:5px;padding:5px 10px;font-weight:600}
.head .t{font-size:16px;font-weight:600}.head .m{color:var(--mut);font-size:12px;margin-bottom:2px}
.link{color:var(--acc);text-decoration:none;font-weight:500}
.tabs{display:flex;gap:22px;padding:0 16px;border-bottom:1px solid var(--line)}
.tab{padding:10px 0;color:var(--mut);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-color:var(--acc);box-shadow:0 8px 14px -10px var(--acc)}
.tab i{font-style:normal;margin-left:6px;font-size:11px;color:var(--mut);border:1px solid var(--line2);border-radius:4px;padding:0 5px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kp div{background:var(--s1);padding:10px 16px;border-left:2px solid var(--c)}
.kp b{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}.kp span{display:block;color:var(--mut);font-size:12px}
.canvas{margin:14px 16px;border:1px solid var(--line);border-radius:6px;background:radial-gradient(ellipse at 70% 0%,#ffffff06,transparent 60%),var(--bg);padding:10px}
.canvas svg{display:block;width:100%;height:auto}
table{width:calc(100% - 32px);margin:0 16px 16px;border-collapse:collapse}
th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line)}
.cve{font-family:"IBM Plex Mono",monospace;color:var(--acc);font-size:12.5px}
.kev{border:1px solid #ff5a5f66;color:#ff8a8d;border-radius:4px;padding:0 5px;font-size:11px;margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:6px}
</style>
<style>body{margin:0;padding:24px;background:#03060c}</style>
</head><body>
<div class="ws b" id="wb"></div>
<script>
(function(){
const LEVELS=[["exploitation","Exploitation",[["none","None"],["public_poc","Public PoC"],["active","Active"]]],["system_exposure","System Exposure",[["small","Small"],["controlled","Controlled"],["open","Open"]]],["automatable","Automatable",[["no","No"],["yes","Yes"]]],["human_impact","Human Impact",[["low","Low"],["medium","Medium"],["high","High"],["very_high","Very High"]]],["decision","SSVC outcome",[["defer","Defer"],["scheduled","Scheduled"],["out_of_cycle","Out-of-Cycle"],["immediate","Immediate"]]]];
const PAL={immediate:"#ff5a5f",out_of_cycle:"#ffb340",scheduled:"#5b8cff",defer:"#64748b"},LBL={immediate:"Immediate",out_of_cycle:"Out-of-Cycle",scheduled:"Scheduled",defer:"Defer"};
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;const pick=(a,w)=>{let r=rnd()*w.reduce((x,y)=>x+y,0);for(let i=0;i<a.length;i++){if((r-=w[i])<0)return a[i];}return a[a.length-1];};
const rows=Array.from({length:40},(_,i)=>{const e=pick(["none","public_poc","active"],[22,11,7]),x=pick(["small","controlled","open"],[10,16,14]),a=pick(["no","yes"],[26,14]),h=pick(["low","medium","high","very_high"],[8,16,12,4]);const s={none:0,public_poc:1,active:2.2}[e]+{small:0,controlled:.6,open:1.2}[x]+{no:0,yes:.6}[a]+{low:0,medium:.5,high:1,very_high:1.5}[h];return {i,exploitation:e,system_exposure:x,automatable:a,human_impact:h,decision:s>=4.2?"immediate":s>=3?"out_of_cycle":s>=1.3?"scheduled":"defer"};});
const cnt=o=>rows.filter(r=>r.decision===o).length;
function flow(){const W=1000,H=300,top=30,plotH=H-top-6,gap=9,minH=16,bw=128,colX=[0,218,436,654,872],scale=(plotH-3*gap-4*minH)/rows.length,nodes={};let lab="",out="",nd="";
 LEVELS.forEach(([k,l,v],c)=>{const cs=v.map(([x])=>rows.filter(r=>r[k]===x).length),hs=cs.map(n=>minH+n*scale);let y=top+(plotH-(hs.reduce((a,b)=>a+b,0)+gap*(v.length-1)))/2;v.forEach(([x],i)=>{nodes[k+x]={x:colX[c],y,h:hs[i],n:cs[i]};y+=hs[i]+gap;});lab+=`<text x="${colX[c]}" y="14" font-size="11.5" fill="#8391ab">${l}</text>`;});
 const off={};for(let c=0;c<4;c++){const [ka,,va]=LEVELS[c],[kb,,vb]=LEVELS[c+1];va.forEach(([a])=>vb.forEach(([b])=>["defer","scheduled","out_of_cycle","immediate"].forEach(o=>{const n=rows.filter(r=>r[ka]===a&&r[kb]===b&&r.decision===o).length;if(!n)return;const p=nodes[ka+a],q=nodes[kb+b],w=n*scale,so=off["o"+ka+a]||0,ti=off["i"+kb+b]||0;off["o"+ka+a]=so+w;off["i"+kb+b]=ti+w;const y1=p.y+(p.h-p.n*scale)/2+so,y2=q.y+(q.h-q.n*scale)/2+ti,x1=p.x+bw,x2=q.x,mx=(x1+x2)/2;out+=`<path d="M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2} L ${x2} ${y2+w} C ${mx} ${y2+w}, ${mx} ${y1+w}, ${x1} ${y1+w} Z" fill="${PAL[o]}" fill-opacity=".3" style="mix-blend-mode:screen"/>`;})));}
 LEVELS.forEach(([k,,v])=>v.forEach(([x,l])=>{const n=nodes[k+x],leaf=k==="decision",e=!n.n,c=leaf?PAL[x]:null;nd+=`<rect x="${n.x}" y="${n.y}" width="${bw}" height="${n.h}" rx="5" fill="${leaf?c+"1f":"#0b1222"}" stroke="${leaf?c:e?"#1b2740":"#2c3b5a"}"/><text x="${n.x+10}" y="${n.y+n.h/2+4}" font-size="12" font-weight="${leaf?600:500}" fill="${leaf?c:e?"#4a566d":"#d7deec"}">${l}</text><text x="${n.x+bw-10}" y="${n.y+n.h/2+4}" text-anchor="end" font-size="12" font-weight="600" fill="${e?"#4a566d":leaf?c:"#f1f4fa"}" style="font-variant-numeric:tabular-nums">${n.n}</text>`;}));
 return `<svg viewBox="0 0 ${W} ${H}" font-family="IBM Plex Sans,system-ui">${lab}${out}${nd}</svg>`;}
const L={none:"None",public_poc:"Public PoC",active:"Active",small:"Small",controlled:"Controlled",open:"Open",no:"No",yes:"Yes",low:"Low",medium:"Medium",high:"High",very_high:"Very High"};
const ord={immediate:0,out_of_cycle:1,scheduled:2,defer:3};const pk=["spring-beans 5.3.17","libc6 2.36-9","xz-utils 5.6.0","lodash 4.17.20","openssl 3.0.11"];
const tbl=rows.slice().sort((a,b)=>ord[a.decision]-ord[b.decision]).slice(0,5).map((r,i)=>`<tr><td><span class="pill"><span class="dot" style="background:${PAL[r.decision]}"></span>${LBL[r.decision]}</span></td><td><span class="cve">CVE-2024-${3094+i*311}</span>${r.exploitation==="active"?'<span class="kev">KEV</span>':""}</td><td>${pk[i]}</td><td>${L[r.exploitation]}</td><td>${L[r.system_exposure]}</td><td>${L[r.automatable]}</td><td>${L[r.human_impact]}</td></tr>`).join("");
const html=`<div class="top"><div class="logo"><span class="mark"></span>PatchTriage<span class="crumb">Workspace / <b>checkout-api</b></span></div><div style="display:flex;gap:8px"><button class="tbtn">Import organization</button><button class="tbtn p">Run all</button></div></div>
<div class="body"><aside class="side"><div style="display:flex;justify-content:space-between;align-items:center"><h4>Targets</h4><button class="tbtn" style="padding:3px 9px">Add</button></div>
<div class="tgt on"><b>checkout-api</b><small>trivy.json · 40 findings</small><div class="st"><span class="dot" style="background:var(--im)"></span>Immediate</div></div>
<div class="tgt"><b>web-frontend</b><small>SPDX SBOM · 12 findings</small><div class="st"><span class="dot" style="background:var(--oc)"></span>Out-of-Cycle</div></div>
<div class="tgt"><b>batch-worker</b><small>Ready to run</small></div>
<div class="stats"><div><b>3</b><span>Targets</span></div><div><b>9</b><span>Known exploited</span></div><div><b>100%</b><span>Decisions verified</span></div><div><b>75%</b><span>Inputs from authority</span></div></div></aside>
<main class="main"><div class="panel"><div class="head"><span class="badge">Immediate</span><div><div class="m">checkout-api · 40 findings · 14 actions · workflow within 3 days</div><div class="t">Upgrade org.springframework:spring-beans to 5.3.18</div></div><div style="display:grid;gap:4px;text-align:right"><a class="link" href="#">Open full report</a><a class="link" href="#" style="color:var(--mut)">Download HTML</a></div></div>
<div class="tabs"><span class="tab on">Overview<i>40</i></span><span class="tab">Decision path</span><span class="tab">Action queue<i>14</i></span><span class="tab">Evidence &amp; policy</span><span class="tab">Review inputs<i>6</i></span></div>
<div class="kp"><div style="--c:var(--im)"><b>${cnt("immediate")}</b><span>Immediate</span></div><div style="--c:var(--oc)"><b>${cnt("out_of_cycle")}</b><span>Out-of-Cycle</span></div><div style="--c:var(--sc)"><b>${cnt("scheduled")}</b><span>Scheduled</span></div><div style="--c:var(--de)"><b>${cnt("defer")}</b><span>Defer</span></div></div>
<div class="canvas">${flow()}</div>
<table><thead><tr><th>Outcome</th><th>Finding</th><th>Package</th><th>Exploitation</th><th>Exposure</th><th>Automatable</th><th>Human Impact</th></tr></thead><tbody>${tbl}</tbody></table></div></main></div>`;
document.getElementById("wb").innerHTML=html;
})();
</script>

</body></html>
